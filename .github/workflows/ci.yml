name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      TILIA: tilia
      DATASET_CONVERTERS_CACHE: ${{ github.workspace }}/.cache/dataset-converters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # System libraries TiLiA's own CI installs to run Qt offscreen and play audio
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libglib2.0-dev libnss3-dev libportmidi-dev libpulse-dev libsndfile1-dev \
            libdbus-1-3 libegl1-mesa-dev libgles2-mesa-dev libxcomposite-dev libxcursor-dev \
            libxi-dev libxkbcommon-x11-0 libxrandr2 libxtst-dev libdrm-dev libxcb-cursor-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb-dev libxkbcommon-dev libopengl-dev libvulkan-dev \
            ffmpeg libavcodec-dev libavformat-dev libswscale-dev

      # Pinned to the commit of the v0.7.0 tag: "@v0.7.0" would pick up a branch of the same name (0.6.2)
      - name: Install TiLiA and this repository
        run: |
          python -m pip install --upgrade pip
          pip install "TiLiA @ git+https://github.com/TimeLineAnnotator/desktop@eb605f720847cf86f47834e71bc5bd9f8e0cd606"
          pip install -e . pytest

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATASET_CONVERTERS_CACHE }}
          key: dataset-cache-${{ hashFiles('conftest.py', 'tests/**', 'bpsd/tests/**', 'dcml-mozart/tests/**') }}
          restore-keys: dataset-cache-

      - name: Run tests
        run: pytest -v
