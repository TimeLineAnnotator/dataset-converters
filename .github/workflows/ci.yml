name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      DATASET_CONVERTERS_CACHE: ${{ github.workspace }}/.cache/dataset-converters
      # TiLiA's command line runs from an environment of its own (see "Install TiLiA's command line")
      TILIA: ${{ github.workspace }}/.tilia-cli/bin/tilia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # System libraries TiLiA's own CI installs to run Qt offscreen and play audio
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libglib2.0-dev libnss3-dev libportmidi-dev libpulse-dev libsndfile1-dev \
            libdbus-1-3 libegl1-mesa-dev libgles2-mesa-dev libxcomposite-dev libxcursor-dev \
            libxi-dev libxkbcommon-x11-0 libxrandr2 libxtst-dev libdrm-dev libxcb-cursor-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb-dev libxkbcommon-dev libopengl-dev libvulkan-dev \
            ffmpeg libavcodec-dev libavformat-dev libswscale-dev

      # The converters need `timelines add harmony` and `timelines import harmony`, which are in
      # TimeLineAnnotator/desktop#575 and #632 but in no release yet: pinned to #632's head until they are.
      - name: Install TiLiA's command line
        run: |
          python -m venv .tilia-cli
          .tilia-cli/bin/pip install "TiLiA @ git+https://github.com/TimeLineAnnotator/desktop@eb4f29bccf3605cbd36caaedf097e726367d9122"

      # This repository, with format-converters (pinned) and, through it, TiLiA 0.7.0's parser as a library
      - name: Install this repository
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATASET_CONVERTERS_CACHE }}
          key: dataset-cache-${{ hashFiles('conftest.py', 'tests/**', '*/tests/**') }}
          restore-keys: dataset-cache-

      - name: Run tests
        run: pytest -v
