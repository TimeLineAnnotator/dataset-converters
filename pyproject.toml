[project]
name = "dataset-converters"
version = "0.1.0"
description = "Converters from published music-analysis datasets to TiLiA files"
requires-python = ">=3.12"
dependencies = [
    "format-converters @ git+https://github.com/TimeLineAnnotator/format-converters@7aab5fc0ae3569bf73ba243e14545f09e52a54a9",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "bpsd/tests", "choro/tests", "dcml-mozart/tests", "dezrann-mozart/tests", "swd/tests"]
addopts = "--import-mode=importlib"
markers = [
    "network: downloads from the datasets' servers",
    "tilia: runs TiLiA's command line",
]
