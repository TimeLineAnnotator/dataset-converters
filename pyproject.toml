[project]
name = "dataset-converters"
version = "0.1.0"
description = "Converters from published music-analysis datasets to TiLiA files"
requires-python = ">=3.12"
dependencies = [
    "format-converters @ git+https://github.com/TimeLineAnnotator/format-converters@0575663eea3dea27bdc278e46bb1fbd8b5eef8dd",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "bpsd/tests", "dcml-mozart/tests", "dezrann-mozart/tests", "swd/tests"]
addopts = "--import-mode=importlib"
